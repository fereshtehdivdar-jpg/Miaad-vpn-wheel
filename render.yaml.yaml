services:
  - type: web
    name: miaad-vpn-wheel
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_USERNAME
        value: miaad_vpn
      - key: INSTAGRAM_URL
        value: https://www.instagram.com/miaad.vpn
      - key: WEBAPP_URL
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: NODE_VERSION
        value: 18.17.0